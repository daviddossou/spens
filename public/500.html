<!DOCTYPE html>
<html lang="en">
<head>
  <title>Something went wrong · Spens</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; }

    body {
      background: #F8F9FA;
      color: #282A33;
      font-family: "Geist", "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      line-height: 1.5;
    }

    main {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      max-width: 26rem;
      width: 100%;
      padding: 2.5rem 2rem;
      text-align: center;
    }

    .brand {
      color: #3F51B5;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.25;
      margin-top: 1.75rem;
    }

    p {
      color: #8D909F;
      font-size: 0.875rem;
      margin-top: 0.5rem;
    }

    p[lang="fr"] {
      border-top: 1px solid #F8F9FA;
      margin-top: 1.25rem;
      padding-top: 1.25rem;
    }

    p[lang="fr"] strong {
      color: #282A33;
      display: block;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .home {
      background: #3F51B5;
      border: 2px solid transparent;
      border-radius: 6px;
      color: #ffffff;
      display: inline-block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-top: 1.75rem;
      padding: 0.5rem 1.25rem;
      text-decoration: none;
    }

    .home:hover { background: #303f9f; }

    .home:focus-visible {
      box-shadow: 0 0 0 3px rgba(63, 81, 181, 0.2);
      outline: none;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">Spens</div>
    <h1>Something went wrong</h1>
    <p>It's not you — it's us. We've been notified and are looking into it. Please try again in a moment.</p>
    <p lang="fr"><strong>Une erreur est survenue</strong>Ce n'est pas vous — c'est nous. Nous avons été prévenus et nous en occupons. Réessayez dans un instant.</p>
    <a class="home" href="/">Back to Spens · Retour à Spens</a>
  </main>
</body>
</html>
