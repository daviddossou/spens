<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#3F51B5">
  <title>Spens · hors ligne</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: #F8F9FA;
      color: #282A33;
      font: 400 1rem/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    main { max-width: 22rem; }
    .mark {
      width: 3.5rem;
      height: 3.5rem;
      margin: 0 auto 1.25rem;
      border-radius: 50%;
      background: #c5cae8;
      color: #3F51B5;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mark svg { width: 1.75rem; height: 1.75rem; }
    h1 { margin: 0 0 0.5rem; font-size: 1.25rem; font-weight: 600; letter-spacing: -0.01em; }
    p { margin: 0 0 1.5rem; color: #5b606e; }
    p.en { font-size: 0.875rem; }
    button {
      appearance: none;
      border: 0;
      border-radius: 6px;
      padding: 0.75rem 1.25rem;
      background: #3F51B5;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #303f9f; }
    button:focus-visible { outline: 3px solid rgba(63, 81, 181, 0.35); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.1 16.7a5 5 0 017.8 0M5.3 13.5a9 9 0 0113.4 0M2.5 10.3a13 13 0 0119 0M12 20h.01M3 3l18 18"/>
      </svg>
    </div>
    <h1>Tu es hors ligne</h1>
    <p>Spens a besoin du réseau pour afficher tes comptes à jour. Réessaie dès que la connexion revient.</p>
    <p class="en">You're offline. Spens needs the network to show your accounts up to date.</p>
    <button type="button" onclick="location.reload()">Réessayer · Retry</button>
  </main>
</body>
</html>
