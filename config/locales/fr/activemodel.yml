        not_an_integer: "doit être un nombre entier"
        odd: "doit être impair"
        other_than: "doit être différent de %{count}"
        present: "doit être vide"
        required: "doit exister"
      # Form objects speak to the user in full sentences: the message stands alone,
      # without the technical attribute name in front of it.
      models:
        transaction:
          format: "%{message}"
          attributes:
            kind:
              blank: "Choisis le type d'opération."
              inclusion: "Choisis le type d'opération."
