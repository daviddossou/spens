            transaction_date:
              blank: "Indique la date de l'opération."
            transaction_type_name:
              blank: "Choisis une catégorie."
            from_account_name:
              blank: "Choisis le compte depuis lequel l'argent a été envoyé."
            to_account_name:
              blank: "Choisis le compte qui a reçu l'argent."
              different_account: "Choisis deux comptes différents pour ce transfert."
            contact_name:
              blank: "Indique avec qui est cette dette."
